[project]
name = "aiochlite"
version = "1.7.0"
authors = [{ name = "darkstussy" }, ]
description = "Lightweight asynchronous ClickHouse client for Python built on aiohttp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "clickhouse",
    "clickhouse-client",
    "async",
    "asyncio",
    "aiohttp",
    "database",
    "driver",
    "olap",
    "analytics",
]
dependencies = [
    "aiohttp>=3.13,<4",
    "tzdata; platform_system == 'Windows'"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
aiohttp-speedups = [
    "aiohttp[speedups]>=3.13,<4",
]

[project.urls]
Homepage = "https://github.com/darkstussy/aiochlite"
Documentation = "https://github.com/darkstussy/aiochlite#readme"
Changelog = "https://github.com/darkstussy/aiochlite/blob/main/CHANGELOG.md"
Repository = "https://github.com/darkstussy/aiochlite"
Issues = "https://github.com/darkstussy/aiochlite/issues"

[build-system]
requires = ["hatchling<1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiochlite"]

[dependency-groups]
dev = [
    "ruff==0.15.13",
    "basedpyright==1.39.4",
    "mypy==2.3.0",
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov~=7.1.0",
]

[tool.coverage.run]
source = ["aiochlite"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
